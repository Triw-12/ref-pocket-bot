name: Maintenir le compte principal
on:
  workflow_dispatch:
    inputs:
      generation:
        description: "Génération dont ouvrir les boosters"
        type: choice
        options:
          - auto
          - "1"
          - "2"
        default: auto

# Deux exécutions simultanées annuleraient mutuellement leurs échanges en cours
concurrency: rapatrier

jobs:
  maintenir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lire l'historique de la machine (artifacts des runs précédents)
    # Large : un arrêt en cours de route laisserait des cartes ou des Kheys prêtés.
    # La machine à sous fait jusqu'à 500 tours par compte : le maximum de GitHub.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les logs de ce dépôt sont publics : chaque e-mail et mot de passe est masqué avant
      # de lancer le script. Sans compte valide, on s'arrête : le script en créerait un nouveau.
      - name: Préparer les comptes
        shell: bash
        run: |
          umask 077
          printf '%s' "$COMPTES" > projet_secret/compte-auto.json
          [ "$(jq length projet_secret/compte-auto.json)" -gt 0 ] || { echo "Secret COMPTES_AUTO absent ou invalide."; exit 1; }
          jq -r 'if type == "array" then .[] else . end | .email, .password' projet_secret/compte-auto.json |
            while IFS= read -r valeur; do echo "::add-mask::$valeur"; done
        env:
          COMPTES: ${{ secrets.COMPTES_AUTO }}
      - name: Maintenance
        run: |
          options=()
          if [ "$GENERATION" = "1" ] || [ "$GENERATION" = "2" ]; then options+=("--gen=$GENERATION"); fi
          python3 -u projet_secret/maintenir.py "${options[@]}"
        env:
          GENERATION: ${{ inputs.generation }}
          # Hors du dépôt : chaque compte ne se connecte qu'une fois par lancement
          REF_SESSIONS: ${{ runner.temp }}/sessions.json
      - run: '[ ! -f ameliorations.md ] || cat ameliorations.md >> "$GITHUB_STEP_SUMMARY"'
        if: always()
      - run: '[ ! -f machine.md ] || { echo "# Machine à sous"; cat machine.md; } >> "$GITHUB_STEP_SUMMARY"'
        if: always()
      # Historique de la machine, lu par projet_secret/bilan-machine.py (sans pseudo ni e-mail)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: machine
          path: machine.jsonl
          retention-days: 90
          if-no-files-found: ignore
      # Bilan cumulé : récupère l'historique des runs précédents, y ajoute celui-ci et le renvoie
      - name: Bilan cumulé de la machine
        id: bilan
        if: always()
        continue-on-error: true
        run: |
          python3 -u projet_secret/bilan-machine.py --courant=machine.jsonl
          cat bilan-machine.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.bilan.outcome == 'success' }}
        with:
          name: historique-machine
          path: historique-machine/historique.jsonl
          retention-days: 90
          if-no-files-found: ignore
