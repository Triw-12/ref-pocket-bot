name: Bilan de la machine à sous
on:
  workflow_dispatch:

# Lancé en même temps qu'un autre bilan (celui de Maintenir), rien n'est perdu : chacun relit
# les runs récents. Deux lancements manuels se suivent simplement.
concurrency: bilan-machine

jobs:
  bilan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lire l'historique de la machine (artifacts des runs précédents)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Bilan cumulé : récupère l'historique des runs précédents, y ajoute celui-ci et le renvoie
      - name: Bilan cumulé de la machine
        id: bilan
        run: |
          python3 -u projet_secret/bilan-machine.py
          cat bilan-machine.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.bilan.outcome == 'success' }}
        with:
          name: historique-machine
          path: historique-machine/historique.jsonl
          retention-days: 90
          if-no-files-found: ignore
