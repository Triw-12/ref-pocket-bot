name: Rapport d'échanges
on:
  workflow_dispatch:
    inputs:
      pseudos:
        description: "Pseudos d'amis séparés par des espaces (vide = tous)"
        required: false
        default: ""

jobs:
  rapport:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run echanges -- --json $PSEUDOS
        env:
          REF_EMAIL: ${{ secrets.REF_EMAIL }}
          REF_PASS: ${{ secrets.REF_PASS }}
          PSEUDOS: ${{ inputs.pseudos }}
      - run: cat rapport-echanges.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-echanges
          path: |
            rapport-echanges.md
            echanges.json
